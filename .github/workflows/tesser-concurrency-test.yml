name: Tesser Concurrency Test

on:
  workflow_dispatch:

concurrency:
  group: tesser-test-group
  cancel-in-progress: true

jobs:
  long-job:
    runs-on: ubuntu-latest
    steps:
      - name: Early side-effect (cache write)
        uses: actions/cache@v4
        with:
          path: residual.txt
          key: tesser-residual-${{ github.run_id }}
          restore-keys: tesser-residual-

      - name: Write residual marker immediately
        run: |
          echo "Residual from run ${{ github.run_id }} at $(date)" > residual.txt
          echo "This should be visible if residual state survives cancellation"

      - name: Simulate long work
        run: sleep 120

      - name: Upload artifact (late)
        uses: actions/upload-artifact@v4
        with:
          name: tesser-side-effect-${{ github.run_id }}
          path: residual.txt
